#
#   name = "pkg"                          same thing, in official repos
#   name = { aur = "pkg" }                from the AUR
#   name = { pacman = "pkg", note = "…" } with a note shown to the user
#   name = { covered = "…" }              Omarchy already ships it        (note)
#   name = { not_needed = "…" }           macOS-ism, pointless on Linux   (note)
#   name = { suggestion = "…" }           no equivalent; what to use      (note)
#
# Names not listed here are installed if a package of the same name exists on
# the target, otherwise reported as unknown.

[formula]
ripgrep = "ripgrep"
fd = "fd"
fzf = "fzf"
bat = "bat"
eza = "eza"
jq = "jq"
git = { covered = "Omarchy ships git by default" }
neovim = { covered = "Omarchy ships neovim (LazyVim) by default" }
tmux = "tmux"
zoxide = "zoxide"
starship = "starship"
gh = "github-cli"
mise = { covered = "Omarchy ships mise by default" }
lazygit = { covered = "Omarchy ships lazygit by default" }
lazydocker = "lazydocker"
docker = { suggestion = "Omarchy uses Docker via `omarchy-install-docker-dbs`; the daemon is already installed." }
colima = { not_needed = "Not needed on Linux — Docker runs natively." }
mas = { not_needed = "Mac App Store CLI; no equivalent." }
coreutils = { suggestion = "GNU coreutils are the system default on Linux." }
gnu-sed = { not_needed = "GNU sed is the system default on Linux." }
python = "python"
node = { suggestion = "Use `mise use node@lts` — Omarchy manages runtimes with mise." }
go = { suggestion = "Use `mise use go@latest`." }
rust = { suggestion = "Use `mise use rust@latest` or rustup." }
pnpm = "pnpm"
yarn = "yarn"
wget = "wget"
curl = { not_needed = "Installed by default." }
htop = "htop"
btop = { covered = "Omarchy ships btop by default" }
ffmpeg = "ffmpeg"
imagemagick = "imagemagick"
pandoc = "pandoc"
hugo = "hugo"
postgresql = { suggestion = "Run `omarchy-install-docker-dbs` and choose PostgreSQL." }
redis = { suggestion = "Run `omarchy-install-docker-dbs` and choose Redis." }
mysql = { suggestion = "Run `omarchy-install-docker-dbs` and choose MySQL." }
sqlite = "sqlite"
openssl = "openssl"
gnupg = "gnupg"
direnv = "direnv"
shellcheck = "shellcheck"
tree = "tree"
watch = { not_needed = "Part of procps-ng, installed by default." }

[cask]
visual-studio-code = { aur = "visual-studio-code-bin", note = "Microsoft build, so the extension marketplace works; `code` (Code - OSS) is the repo alternative" }
cursor = { aur = "cursor-bin" }
zed = "zed"
ghostty = "ghostty"
alacritty = { pacman = "alacritty", note = "Omarchy's default terminal" }
kitty = "kitty"
wezterm = "wezterm"
iterm2 = { not_needed = "macOS only. Omarchy ships Alacritty and Ghostty is available." }
firefox = "firefox"
google-chrome = { suggestion = "Omarchy ships Chromium; for Chrome proper use `aur = google-chrome`." }
brave-browser = { aur = "brave-bin" }
arc = { suggestion = "macOS only. Nearest: Zen Browser (`aur = zen-browser-bin`)." }
slack = { aur = "slack-desktop" }
discord = "discord"
zoom = { aur = "zoom" }
spotify = { covered = "Omarchy ships Spotify by default" }
obsidian = { covered = "Omarchy ships Obsidian by default" }
notion = { aur = "notion-app-electron" }
figma = { suggestion = "Use the web app; Omarchy adds it as a web app via `omarchy-webapp-install`." }
1password = { covered = "Omarchy ships 1Password by default" }
"1password-cli" = "1password-cli"
docker = { not_needed = "Docker Engine is installed by Omarchy; Docker Desktop has no Linux equivalent needed." }
orbstack = { not_needed = "Not needed — Docker runs natively." }
raycast = { suggestion = "Omarchy uses Walker as its launcher (Super+Space)." }
alfred = { suggestion = "Omarchy uses Walker as its launcher (Super+Space)." }
rectangle = { not_needed = "Hyprland tiles windows natively." }
karabiner-elements = { suggestion = "Remap keys in ~/.config/hypr/input.conf (kb_options)." }
signal = "signal-desktop"
telegram = "telegram-desktop"
vlc = "vlc"
obs = "obs-studio"
gimp = "gimp"
inkscape = "inkscape"
blender = "blender"
postman = { aur = "postman-bin" }
tableplus = { suggestion = "macOS/Windows only. Nearest: DBeaver (`dbeaver`)." }
font-jetbrains-mono-nerd-font = { pacman = "ttf-jetbrains-mono-nerd", note = "Omarchy's default font" }
font-fira-code = "ttf-fira-code"
font-hack-nerd-font = "ttf-hack-nerd"
