[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LoamStudios/omarchy-onboard"

[workspace.dependencies]
omarchy-onboard-core = { path = "crates/core" }
omarchy-onboard-topics = { path = "crates/topics" }
omarchy-onboard-target = { path = "crates/target" }
omarchy-onboard-net = { path = "crates/net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
