[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/loamstudios/omarchy-migration-assistant"

[workspace.dependencies]
omarchy-migrate-core = { path = "crates/core" }
omarchy-migrate-checks = { path = "crates/checks" }
omarchy-migrate-rules = { path = "crates/rules" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
